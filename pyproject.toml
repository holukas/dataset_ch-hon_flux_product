[project]
name = "dataset-ch-hon-flux-product"
version = "0.1.0"
description = "Flux data processing pipeline for the CH-HON forest station"
authors = [{ name = "Lukas Hörtnagl", email = "lukas.hoertnagl@usys.ethz.ch" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=3.0,<4.0",
    "matplotlib>=3.10,<4.0",
    "numpy>=2.2,<3.0",
    "diive",
    # yellowbrick (via diive) imports distutils, removed from the Python 3.12 stdlib;
    # setuptools provides the compatibility shim
    "setuptools>=70",
]

[dependency-groups]
dev = [
    "dbc-influxdb",
    "ghp-import>=2.1.0",
    "jupyter-book>=1.0.4.post1",
    "sphinxcontrib-mermaid>=1.0.0",
]

[tool.uv]
# shap pulls in numba transitively; pin to a build that supports Python 3.12 + numpy 2.x
constraint-dependencies = ["numba>=0.61"]

[tool.uv.sources]
diive = { path = "../../diive", editable = true }
dbc-influxdb = { path = "../../poet/dbc-influxdb", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
